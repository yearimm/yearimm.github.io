
# 사이트 설정

# 테마 불러오기
theme: jekyll-theme-chirpy

# 웹페이지 언어 › http://www.lingoes.net/en/translator/langcode.htm
# `_data/locales` 폴더에 같은 이름의 언어 파일이 있다면
# 레이아웃 언어도 함께 변경됩니다.
# 해당 언어 파일이 없다면 기본 언어인 'en'이 사용됩니다.
lang: en

# 시간대 설정 › https://zones.arilyn.cc
timezone:

# jekyll-seo-tag 설정 › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: YEARIM # 블로그의 메인 제목

tagline: yearim.me.kr # 블로그 부제목으로 표시됩니다.

description: >- # SEO 메타데이터와 Atom 피드에 사용되는 설명
  A minimal, responsive and feature-rich Jekyll theme for technical writing.

# 사이트의 프로토콜과 호스트 이름을 입력하세요.
# 예: 'https://username.github.io'
# 주소 끝에 '/'를 붙이지 마세요.
url: ""

github:
  username: github_yearimm # GitHub 사용자 이름으로 변경하세요.

twitter:
  username: twitter_username # Twitter 사용자 이름으로 변경하세요.

social:
  # 본인의 이름으로 변경하세요.
  # 게시글의 기본 작성자 및 페이지 하단의 저작권자로 표시됩니다.
  name: YEARIM
  email: example@domain.com # 본인의 이메일 주소로 변경하세요.
  fediverse_handle: # Fediverse 계정을 입력하세요. 예: "@username@domain.com"
  links:
    # 첫 번째 항목은 저작권자 이름에 연결되는 링크입니다.
    - https://twitter.com/username # 본인의 Twitter 프로필 주소로 변경하세요.
    - https://github.com/username # 본인의 GitHub 프로필 주소로 변경하세요.
    # 다른 소셜 링크를 추가하려면 아래 주석을 해제하세요.
    # - https://www.facebook.com/username
    # - https://www.linkedin.com/in/username

# 사이트 소유권 인증 설정
webmaster_verifications:
  google: # Google 사이트 인증 코드를 입력하세요.
  bing: # Bing 사이트 인증 코드를 입력하세요.
  alexa: # Alexa 사이트 인증 코드를 입력하세요.
  yandex: # Yandex 사이트 인증 코드를 입력하세요.
  baidu: # Baidu 사이트 인증 코드를 입력하세요.
  facebook: # Facebook 사이트 인증 코드를 입력하세요.

# ↑ --------------------------
# jekyll-seo-tag 설정 끝

# 웹사이트 방문 통계 설정
analytics:
  google:
    id: # Google Analytics ID를 입력하세요.
  goatcounter:
    id: # GoatCounter ID를 입력하세요.
  umami:
    id: # Umami ID를 입력하세요.
    domain: # Umami 도메인을 입력하세요.
  matomo:
    id: # Matomo ID를 입력하세요.
    domain: # Matomo 도메인을 입력하세요.
  cloudflare:
    id: # Cloudflare Web Analytics 토큰을 입력하세요.
  fathom:
    id: # Fathom Site ID를 입력하세요.

# 게시글 조회수 설정
pageviews:
  provider: # 현재 'goatcounter'만 지원합니다.

# 기본 색상 테마 설정
#
# 비워두면 사용자의 시스템 설정에 따라 색상 테마가 자동으로 적용됩니다.
# 이 경우 사이드바 왼쪽 하단에 테마 전환 버튼이 표시됩니다.
#
# 사용 가능한 옵션:
#
#     light — 라이트 모드 사용
#     dark — 다크 모드 사용
#
theme_mode: # [light | dark]

# 미디어 리소스를 제공할 CDN 주소
# CDN 주소를 지정하면 '/'로 시작하는 모든 미디어 경로에
# 해당 CDN 주소가 자동으로 추가됩니다.
# 적용 대상: 사이트 프로필 이미지, 게시글 이미지, 오디오, 동영상 등
#
# 예: 'https://cdn.com'
cdn:

# 사이드바에 표시할 프로필 이미지
# 로컬 이미지 또는 CORS가 허용된 외부 이미지 주소를 사용할 수 있습니다.
avatar:

# 사이트 전체에 적용할 소셜 미리보기 이미지 주소
# SEO의 'og:image' 메타 태그에 사용됩니다.
# 각 페이지의 front matter에서 'page.image'를 지정하면 덮어쓸 수 있습니다.
social_preview_image: # 문자열, 로컬 또는 CORS가 허용된 이미지 주소

# 게시글 목차(TOC)를 전체적으로 표시할지 설정합니다.
# true: 표시 / false: 숨김
toc: true

actions:
  # 각 게시글에 '이 게시글 수정하기' 버튼을 표시하여 수정 참여를 유도합니다.
  edit_post:
    enabled: false # true로 설정하면 '이 게시글 수정하기' 버튼이 표시됩니다.
    url: "" # 저장소 기본 주소. 예: https://github.com/cotes2020/jekyll-theme-chirpy/edit/master
    # 게시글 수정 링크를 동적으로 생성할지, 고정 주소를 사용할지 설정합니다.
    # static_url이 false이면 게시글의 파일 경로가 url 뒤에 자동으로 추가됩니다.
    # true이면 모든 게시글에 동일한 수정 링크가 사용됩니다.
    static_url: false # [ true | false ]

comments:
  # 게시글 댓글 시스템 설정
  # 비워두면 댓글 기능이 비활성화됩니다.
  provider: # [disqus | utterances | giscus]

  # Disqus 댓글 설정
  disqus:
    shortname: # Disqus shortname을 입력하세요. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname

  # utterances 댓글 설정 › https://utteranc.es/
  utterances:
    repo: # <GitHub 사용자 이름>/<저장소 이름>
    issue_term: # < url | pathname | title | ...>

  # Giscus 댓글 설정 › https://giscus.app
  giscus:
    repo: # <GitHub 사용자 이름>/<저장소 이름>
    repo_id:
    category:
    category_id:
    mapping: # 선택 사항, 기본값은 'pathname'입니다.
    strict: # 선택 사항, 기본값은 '0'입니다.
    input_position: # 선택 사항, 기본값은 'bottom'입니다.
    lang: # 선택 사항, 기본값은 site.lang 값입니다.
    reactions_enabled: # 선택 사항, 기본값은 '1'입니다.

# 정적 리소스를 자체 호스팅하는 설정 (선택 사항)
# https://github.com/cotes2020/chirpy-static-assets
assets:
  self_host:
    enabled: # 불리언 값, 비워두면 false로 처리됩니다.
    # Jekyll 실행 환경을 지정합니다. 비워두면 두 환경 모두 적용됩니다.
    # 'assets.self_host.enabled'가 true일 때만 작동합니다.
    env: # [development | production]

# PWA 설정
pwa:
  enabled: true # PWA 기능 활성화 여부 (앱처럼 설치 가능)
  cache:
    enabled: true # PWA 오프라인 캐시 활성화 여부
    # 아래에 지정한 경로는 PWA 캐시에서 제외됩니다.
    # 일반적으로 같은 도메인을 사용하는 다른 웹사이트의
    # baseurl 경로를 지정할 때 사용합니다.
    deny_paths:
      # - "/example"  # '<SITE_URL>/example/*'에 해당하는 주소는 캐시하지 않습니다.

# 한 페이지에 표시할 게시글 수
paginate: 10

# 사이트의 기본 경로
baseurl: ""

# ------------ 아래 설정은 수정하지 않는 것을 권장합니다. ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge 문법 강조 옵션 › https://github.com/jneen/rouge#full-options
    css_class: highlight
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: "" # 빈 문자열은 프로젝트의 모든 파일을 의미합니다.
      type: posts
    values:
      layout: post
      comments: true # 게시글 댓글 기능을 활성화합니다.
      toc: true # 게시글에 목차 영역을 표시합니다.
      # 아래 설정은 모든 게시글의 링크 구조에 영향을 줍니다.
      # 관련 코드를 수정할 수 있는 경우가 아니라면 변경하지 마세요.
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs # 위의 site.collections 설정을 참고하세요.
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/